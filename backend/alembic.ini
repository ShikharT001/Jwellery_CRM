# Alembic Configuration File
# This file is read by Alembic's env.py

[alembic]
# Path to migrations directory
script_location = migrations

# Template for migration file names (includes timestamp)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in migration file names
timezone = UTC

# The database URL is set programmatically in migrations/env.py
# from our application settings. Leave this as a placeholder.
sqlalchemy.url = placeholder

[post_write_hooks]
# Optional: auto-format generated migration files

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
